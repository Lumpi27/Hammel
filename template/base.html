<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Template — {{title}}</title>
  <link rel="stylesheet" href="../assets/template.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html" aria-label="Startseite">
        <img src="../assets/images/LOGO.jpeg" alt="Logo">
      </a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
      <nav class="site-nav">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="../produkte.html">Produkte</a></li>
          <li><a href="../service.html">Service</a></li>
          <li><a href="../kontakt.html">Kontakt</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <!-- Hero section (replace background/image as needed) -->
    <section class="hero">
      <div class="container">
        <h1 class="hero-title">Titel der Seite</h1>
        <p class="hero-sub">Kurzer einleitender Text — prägnant und klar.</p>
        <p class="hero-cta"><a class="btn" href="#">Mehr erfahren</a></p>
      </div>
    </section>

    <section class="content container">
      <!-- CONTENT: ersetzt durch konkrete Seiteninhalte -->
      <article>
        <h2>Überschrift</h2>
        <p>Beispieltext. Ersetze diesen Bereich mit deinem Content.</p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© Deine Marke • Impressum • Datenschutz</p>
    </div>
  </footer>

  <script>
    // Einfacher Toggle für mobile Navigation
    document.addEventListener('DOMContentLoaded', function(){
      var btn = document.querySelector('.nav-toggle');
      var nav = document.querySelector('.site-nav');
      btn && btn.addEventListener('click', function(){
        nav.classList.toggle('open');
      });
    });
  </script>
</body>
</html>
