<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Produkte — Deine Marke</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Deine Marke</a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
      <nav class="site-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">Über uns</a></li>
          <li><a href="produkte.html">Produkte</a></li>
          <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="content container">
      <h1>Produkte</h1>
      <p>Eine Auswahl unserer Produkte. Klicke auf ein Produkt, um mehr zu sehen.</p>

      <div class="grid">
          <a href="#" class="card">
            <span class="eyebrow">Entdecken</span>
            <h3>Schränke &amp; Vitrinen</h3>
            <div class="media-placeholder card-img"><img src="assets/images/product-2.jpg" alt="Produkt 2" style="width:100%;height:100%;object-fit:cover;border-radius:8px"></div>
          </a>
          <a href="#" class="card">
            <span class="eyebrow">Entdecken</span>
            <h3>Kommoden</h3>
            <div class="media-placeholder card-img"><img src="assets/images/product-3.jpg" alt="Produkt 3" style="width:100%;height:100%;object-fit:cover;border-radius:8px"></div>
          </a>
          <a href="#" class="card">
            <span class="eyebrow">Entdecken</span>
            <h3>Tische</h3>
            <div class="media-placeholder card-img"><img src="assets/images/product-4.jpg" alt="Produkt 4" style="width:100%;height:100%;object-fit:cover;border-radius:8px"></div>
          </a>
          <a href="#" class="card">
            <span class="eyebrow">Entdecken</span>
            <h3>Sideboards & Lowboards</h3>
            <div class="media-placeholder card-img"><img src="assets/images/product-5.jpg" alt="Produkt 5" style="width:100%;height:100%;object-fit:cover;border-radius:8px"></div>
          </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© Deine Marke</p>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function(){
      var btn = document.querySelector('.nav-toggle');
      var nav = document.querySelector('.site-nav');
      btn && btn.addEventListener('click', function(){
        nav.classList.toggle('open');
      });
    });
  </script>
</body>
</html>
