<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Produkte — Deine Marke</title>
  <link rel="stylesheet" href="/assets/template.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">Deine Marke</a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
      <nav class="site-nav">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/about.html">Über uns</a></li>
          <li><a href="/produkte.html">Produkte</a></li>
          <li><a href="/kontakt.html">Kontakt</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="content container">
      <h1>Produkte</h1>
      <p>Eine Auswahl unserer Produkte. Klicke auf ein Produkt, um mehr zu sehen.</p>

      <div class="grid">
        <div class="card">
          <img src="/assets/images/car-1.svg" alt="Produkt 1" style="width:100%;height:auto;border-radius:6px">
          <h3>Modell A</h3>
          <p>Kurzbeschreibung des Produkts.</p>
        </div>
        <div class="card">
          <img src="/assets/images/car-2.svg" alt="Produkt 2" style="width:100%;height:auto;border-radius:6px">
          <h3>Modell B</h3>
          <p>Kurzbeschreibung des Produkts.</p>
        </div>
        <div class="card">
          <img src="/assets/images/car-3.svg" alt="Produkt 3" style="width:100%;height:auto;border-radius:6px">
          <h3>Modell C</h3>
          <p>Kurzbeschreibung des Produkts.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© Deine Marke</p>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function(){
      var btn = document.querySelector('.nav-toggle');
      var nav = document.querySelector('.site-nav');
      btn && btn.addEventListener('click', function(){
        nav.classList.toggle('open');
      });
    });
  </script>
</body>
</html>
